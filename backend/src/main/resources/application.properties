spring.application.name=consultora-rrhh
server.port=8080

# Configuración para habilitar el reinicio automático de la aplicación durante el desarrollo
spring.devtools.restart.enabled=true
# ------------------------------------------------------
# No iniciar servidor web ni bdd por el momento, funciona como app de consola
#spring.main.web-application-type=none
# ------------------------------------------------------
# Configuración de las variables de entorno definidas con las credenciales de la base de datos

spring.datasource.username=${DB_capital_humano}
spring.datasource.password=${DB_capital_humano_pass}
# ---------------------------
# Configuración de la URL de conexión a la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/capital_humano
#---------------------------------
spring.jpa.hibernate.ddl-auto=validate
# Configuración para mostrar las consultas SQL en la consola
spring.jpa.show-sql=true

# ---------------------------

#Simplificar lenguajes de los logs de salida mas entendibles y manejables
# ---------------------------
# Configuración del formato de los logs en la consola
logging.pattern.console=%-5level %logger{36} - %msg%n
# Configuración para mostrar la pila de excepciones completa en los logs
logging.exception-conversion-word=%wEx
# ------------------------------------------------------
# Configuración del nivel de logging para la aplicación (puede ser DEBUG, INFO, WARN, ERROR)

logging.level.root=INFO
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=ERROR
# ------------------------------------------------------

spring.jpa.open-in-view=False
# ------------------------------------------------------

#Detener la busqueda de errores en el primer error encontrado
hibernate.validator.fail_fast=true

# ------------------------------------------------------
# ------------------------------------------------------
# ------------------------------------------------------

